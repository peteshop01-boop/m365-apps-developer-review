<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCF KPI Workplan — Local Preview</title>
  <link rel="stylesheet" href="/preview.css">
</head>

  <div class="preview-notice" role="status">LOCAL PREVIEW — SESSION ONLY — NOT CONNECTED TO SHAREPOINT — NO REAL DATA SAVED</div>
  <div class="app-shell">
    <header class="top-bar">
      <img src="/assets/kcf-foundation-landscape-white.png" alt="Kent Cricket Foundation">
      <div class="product-title"><strong>KPI Performance Hub</strong><span>Workplan preview · 2025/26</span></div>
      <div class="identity"><strong>Preview employee</strong><span>Example role · not signed in</span></div>
    </header>
    <nav class="side-nav" aria-label="Preview navigation">
      <span class="nav-label">Employee journey</span>
      <button type="button" data-nav="employee">Employee</button>
      <button type="button" data-nav="build">Build My Workplan</button>
      <button type="button" data-nav="workplan">My Workplan</button>
    </nav>
    <main id="preview-main" tabindex="-1" aria-live="polite">
      <section class="loading-card" aria-busy="true"><strong>Opening the local preview…</strong><span>Loading the controlled Core KPI catalogue.</span></section>
    </main>
  </div>
  <script src="/preview.js"></script>
