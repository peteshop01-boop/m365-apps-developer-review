name: CI
on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "migration/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Source privacy
        run: npm run test:privacy
      - name: Clean dependencies
        run: npm ci --no-fund --audit=false
      - name: Compile, lint, full Jest suite and deterministic package
        run: npm run build
      - name: Package identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-FileHash sharepoint/solution/kcf-performance-hub.sppkg -Algorithm SHA256 | Select-Object Algorithm,Hash | ConvertTo-Json | Set-Content artifacts/package-sha256.json
          git rev-parse HEAD | Set-Content artifacts/source-commit.txt
          Copy-Item sharepoint/solution/kcf-performance-hub.sppkg artifacts/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: candidate-${{ github.sha }}
          path: |
            artifacts/
            jest-output/
          if-no-files-found: warn
          retention-days: 14
  dependency-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Dependency security gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          npm audit --json --audit-level=high 1> artifacts/dependency-audit.json
          $auditExit = $LASTEXITCODE
          npm audit --omit=dev --json 1> artifacts/runtime-audit.json
          exit $auditExit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: audit-${{ github.sha }}
          path: artifacts/
          retention-days: 14
